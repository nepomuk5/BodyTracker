name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu GitHub-hosted runners already include an Android SDK.
      # android-actions/setup-android@v3 currently invokes the removed
      # 'tools' SDK package, failing before Gradle even starts.
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Android project
        run: test -f app/build.gradle.kts && test -f settings.gradle.kts && test -f gradlew

      - name: Assemble debug APK
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RandomLifeStats-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
